<!--
  Form Engine — introduction overview diagram (container level, hand-authored SVG).
  Target location on publication: form-engine/documentation/src/assets/images/form-engine/form-engine-overview.svg
  Embedded from the introduction as image::assets/images/form-engine/form-engine-overview.svg[…]

  Deliberately complementary to the existing architecture chapter, which already shows the internal
  Redux flow (Redux.svg, Architecture.svg): this one answers where the engine sits, what runs
  alongside it in the browser, what it interprets, and what the project supplies.
  Everything the engine needs runs in the one browser process; nothing here is a service.
  Composition and context only — no internal call flow.
-->

