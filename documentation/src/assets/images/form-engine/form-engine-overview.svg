  <title
     id="t">Form Engine overview</title>
  <desc
     id="d">The Form Engine is a library inside an A12 client application — one browser process built by the project. Its own parts are the behavior (a Redux middleware), the view (a connected React component), and the renderer, which is customized through the FormModelMap and the WidgetMap. In the same process run the A12 libraries it builds on — Client for the application frame and activities, Kernel for validation and computation, Widgets for the form controls, and further A12 libraries listed under Artifacts — and the third-party libraries React and Redux, which the application provides as peer dependencies. The project's own code — custom widgets, provider code, and configuration — runs there too. The engine works on three inputs: a Document Model, which defines structure and the validation and computation rules; a Form Model, which defines the layout and behavior of the form for that Document Model; and the document itself, the data owned by the activity. Both models are authored with the SME.</desc>
