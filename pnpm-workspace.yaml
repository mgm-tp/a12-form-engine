# cleanup unused catalog entries during install
cleanupUnusedCatalogs: true

# no cycles between workspace dependencies
disallowWorkspaceCycles: true

# enforce version constraints from package.json
engineStrict: true

# when using "--filter", check that the filter applies to some package
failIfNoMatch: true

# do not check git status when publishing
gitChecks: false

# do not allow any postinstall scripts
allowBuilds:
  core-js: false
  esbuild: false

# CI sets this to warn by default
loglevel: info

# prevent pnpm >10 from self-upgrading,
# since it doesn't use the global node_modules as target
pmOnFail: ignore

# enforce new packages to be at least 1 week old, except our own
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@com.mgmtp.a12.*/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  # security patches deliberately pinned ahead of the age gate.
  # Can be dropped once the patched versions age out:
  # dompurify (GHSA-55q2-fjhq-7xh7) on 2026-08-10.
  - dompurify
  # temporary: trying the latest widgets pre-release, which pulls in lexical@0.51.0
  # and newer @tanstack/*-virtual and framer-motion/motion* releases
  - lexical
  - "@lexical/*"
  - "@tanstack/react-virtual"
  - "@tanstack/virtual-core"
  - framer-motion
  - motion
  - motion-dom
  - motion-utils

# allow conflicting peer dependencies for A12 packages
peerDependencyRules:
  allowAny:
    - "@com.mgmtp.a12.*/*"

# ensure latest deps are installed when updating for audit
resolutionMode: highest

# force pnpm to fail on missing or conflicting peer dependencies
strictPeerDependencies: true

# (for now), only trusted authors can change the lockfile
trustLockfile: true

# do not install packages where trust level decreased
trustPolicy: no-downgrade

# 90d - only police recent publishes; older provenance gaps predate npm attestations
trustPolicyIgnoreAfter: 129600

# before "pnpm run" calls, checks if node_modules are up-to-date
# (e.g. after rebasing / checking out a branch and forgetting "pnpm install")
verifyDepsBeforeRun: warn
