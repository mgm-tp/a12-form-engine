# Run gradle versionCatalogUpdate --interactive to update this file
[versions]
build-utilities = "0.3.1"
dataservices = "39.0.1"
prepare-models = "0.9.0"
# Gradle plugins (third-party)
asciidoc = "4.0.5"
cyclonedx = "3.2.4"
docker = "10.0.0"
shadow = "9.4.2"
spotbugs = "6.5.6"
spotless = "8.7.0"
version-catalog-update = "1.1.0"
# Third-party libraries
commons-cli = "1.11.0"
commons-collections4 = "4.5.0"
commons-io = "2.22.0"
commons-lang3 = "3.20.0"
groovy-yaml = "5.0.6"
gson = "2.14.0"
hamcrest = "3.0"
jsonassert = "1.5.3"
logback-classic = "1.5.34"
lombok = "1.18.46"
metainf-services = "1.11"
nashorn-core = "15.7"
slf4j = "2.0.18"
testng = "7.12.0"

[libraries]
# --- A12 build tooling ---
build-utilities = { module = "com.mgmtp.a12.devtools.plugins:build-utilities", version.ref = "build-utilities" }
# --- A12 data services BOM (centralized version management) ---
dataservices-bom = { module = "com.mgmtp.a12.dataservices:dataservices-parent", version.ref = "dataservices" }
# --- A12 libraries (versions provided by the dataservices BOM) ---
base-model-api = { module = "com.mgmtp.a12.base:base-model-api" }
base-model-consistency = { module = "com.mgmtp.a12.base:base-model-consistency" }
base-model-marshalling = { module = "com.mgmtp.a12.base:base-model-marshalling" }
dataservices-core-metadata = { module = "com.mgmtp.a12.dataservices:dataservices-core-metadata" }
dataservices-modelgraph = { module = "com.mgmtp.a12.dataservices:dataservices-modelgraph-fs-impl" }
dataservices-server-app = { module = "com.mgmtp.a12.dataservices:dataservices-server-app" }
kernel-md-facade = { module = "com.mgmtp.a12.kernel:kernel-md-facade" }
rmc-conversion = { module = "com.mgmtp.a12.rmc:conversion" }
# --- Jackson (versions from the dataservices BOM) ---
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
# --- Apache Commons ---
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commons-cli" }
commons-collections4 = { module = "org.apache.commons:commons-collections4", version.ref = "commons-collections4" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
# --- Logging ---
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# --- Testing ---
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert" }
testng = { module = "org.testng:testng", version.ref = "testng" }
# --- Other third-party ---
docker-plugin = { module = "com.bmuschko:gradle-docker-plugin", version.ref = "docker" }
groovy-yaml = { module = "org.apache.groovy:groovy-yaml", version.ref = "groovy-yaml" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
metainf-services = { module = "org.kohsuke.metainf-services:metainf-services", version.ref = "metainf-services" }
nashorn-core = { module = "org.openjdk.nashorn:nashorn-core", version.ref = "nashorn-core" }

[plugins]
asciidoc = { id = "org.asciidoctor.jvm.convert", version.ref = "asciidoc" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
docker = { id = "com.bmuschko.docker-remote-api", version.ref = "docker" }
prepare-models = { id = "com.mgmtp.a12.devtools.plugins.prepare-models", version.ref = "prepare-models" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
