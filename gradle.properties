author=A12 Engines and Client Team
group=com.mgmtp.a12.formengine
logLevel=INFO
org.gradle.warning.mode=all

# Raise the Gradle daemon heap. The default 512m intermittently GC-thrashed and killed
# the daemon during the full build (java compile + tests + jacoco + 3x CycloneDX SBOM +
# node build), reliably at :devappServices:cyclonedxDirectBom. Metaspace lifted to 512m
# too (was 384m). Preserves Gradle's default encoding/locale/heap-dump args.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en
