buildscript {
    dependencies {
        classpath libs.build.utilities
    }
}

plugins {
    // make plugin available to subprojects without creating multiple instances
    alias(libs.plugins.docker) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.spotbugs) apply false
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.node.gradle)
    alias(libs.plugins.integration)
}

import com.github.gradle.node.pnpm.task.PnpmInstallTask
import com.github.gradle.node.pnpm.task.PnpmTask
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.Helper
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.tasks.PackageJsonModifierTask
import groovy.json.JsonSlurper
import groovy.yaml.YamlSlurper
import org.cyclonedx.model.ExternalReference
import nl.littlerobots.vcu.plugin.resolver.VersionSelectors
import org.apache.tools.ant.taskdefs.condition.Os

import java.nio.file.Paths

/** Define a proper version in build */
String globalVersion = Helper.getVersion(
    file('package.json'),
    project.findProperty('version') as String,
    project.findProperty('use') as String
)

String getPnpmVersion() {
    final String packageManager = new JsonSlurper().parse(file('package.json'))['packageManager'] as String
    return packageManager.split('@')[1]
}
String getPnpmCommand() {
    String pnpm = (Os.isFamily(Os.FAMILY_WINDOWS)) ? 'pnpm.cmd' : 'bin/pnpm'
    return Paths.get("${node.pnpmWorkDir.get()}/pnpm-v${getPnpmVersion()}/${pnpm}")
        .toString()
        .replace(System.getProperty('file.separator'), '/')
}

ext {
    pnpmVersion = getPnpmVersion()
    // On CI there is no pnpm on PATH; gradle-node-plugin downloads one into node.pnpmWorkDir.
    // Tasks that shell out to pnpm themselves instead of using a PnpmTask must go through this.
    pnpmExecutable = System.getenv('CI') ? getPnpmCommand() : 'pnpm'
}

node {
    // as mentioned in the documentation, it's recommended to disable automatic task creation
    enableTaskRules = false
}

void verifyPnpmOnPath() {
    final String executable = Os.isFamily(Os.FAMILY_WINDOWS) ? 'pnpm.cmd' : 'pnpm'
    final boolean available = (System.getenv('PATH') ?: '')
        .split(File.pathSeparator)
        .any { new File(it, executable).canExecute() }

    if (!available) {
        throw new GradleException(
            "pnpm is not installed on your system. Please install with 'npm install -g pnpm@${getPnpmVersion()}'"
        )
    }
}

if (System.getenv('CI')) {
    final String resolvedPnpmVersion = getPnpmVersion()
    final String resolvedPnpmCommand = getPnpmCommand()
    node {
        pnpmVersion = resolvedPnpmVersion
        pnpmCommand = resolvedPnpmCommand
    }
}

tasks.named('pnpmSetup') {
    // locally we use the pnpm from PATH, so there is nothing to install
    enabled = System.getenv('CI') != null
}

tasks.named('pnpmInstall') {
    mustRunAfter(tasks.named('setVersion'))

    if (!System.getenv('CI')) {
        doFirst { verifyPnpmOnPath() }
    }
}

tasks.withType(PnpmInstallTask).configureEach {
    // Leave incremental-install decisions entirely to pnpm rather than Gradle. pnpm runs its own
    // fast up-to-date check against the lock file on every invocation and does nothing when
    // installed dependencies already match, so Gradle's tracking here only adds risk and cost:
    //  - Correctness: pnpm resolves versions from more than the root package.json (which is the
    //    plugin's only declared @InputFile) - workspace member package.json files, and
    //    catalog/catalogs/overrides/patchedDependencies in pnpm-workspace.yaml. Any of these can
    //    change without touching the root package.json, leaving Gradle's up-to-date check stale.
    //  - Cost: the plugin declares node_modules as an @OutputDirectory, but pnpm links workspace
    //    and transitive packages into it via relative symlinks whose peer-dependency loops yield
    //    ever-longer unique absolute paths. Gradle 9.6's DirectorySnapshotter cannot detect the
    //    cycle and recurses until it exhausts the daemon heap.
    // Untracking the task (see gradle-node-plugin#287, endorsed by the maintainer) sidesteps both:
    // pnpm owns correctness, and Gradle no longer snapshots node_modules. Trade-off: the task
    // never reports UP-TO-DATE and always invokes pnpm's (fast) check.
    doNotTrackState('pnpm runs its own incremental install; see gradle-node-plugin#287')
}

allprojects {
    pluginManager.apply('base')
    version = globalVersion
    group = 'com.mgmtp.a12.formengine'

    tasks.register('deploy') {}

    // even non-Java projects may have logging during the build
    tasks.withType(JavaForkOptions).configureEach {
        def loggingConfiguration = rootProject.file('logback.xml').absolutePath
        systemProperty 'logback.logLevel', project.findProperty('logLevel')
        systemProperty 'logging.config', loggingConfiguration
    }

    // TODO A12-19152: remove once dataservices ships a release pinning jsonrpc4j 2.0.0.
    // The dataservices 39.0.x BOM constrains com.mgmtp.a12.jsonrpc4j:jsonrpc4j to the
    // pre-release 2.0.0-dev.0, which was removed from artifactory on 2026-08-01, so any
    // build with a cold cache fails to resolve. 2.0.0 is the published release of the
    // same code and declares identical dependencies.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.mgmtp.a12.jsonrpc4j'
                && details.requested.name == 'jsonrpc4j'
                && details.requested.version == '2.0.0-dev.0') {
                details.useVersion '2.0.0'
                details.because 'A12-19152: 2.0.0-dev.0 is not published; 2.0.0 is the released equivalent'
            }
        }
    }
}

if (file('publish/build.gradle').exists()) {
    apply from: 'publish/build.gradle'
}

// Shared configuration for Java library projects
subprojects {
    if (
        project.name == 'form-parent' ||
        project.name == 'form-model' ||
        project.name == 'devappServices' ||
        project.name == 'java-codemod'
    ) {
        pluginManager.apply('maven-publish')
        pluginManager.apply('org.cyclonedx.bom')

        if (project.name != 'form-parent') {
            pluginManager.apply('java-library')

            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(25)
                }
                withSourcesJar()
            }

            tasks.withType(Jar).configureEach {
                into('META-INF') {
                    from(rootProject.file('LICENSE'))
                    from(rootProject.file('NOTICE'))
                    from(rootProject.file('THIRD_PARTY_NOTICES'))
                    from(rootProject.file('licenses')) {
                        into('licenses')
                    }
                }
            }

            // java-codemod is a pure resource JAR (OpenRewrite YAML), skip code quality tools
            if (project.name != 'java-codemod') {
                pluginManager.apply('jacoco')
                pluginManager.apply('com.github.spotbugs')
                pluginManager.apply('com.diffplug.spotless')

                // A12 Data Services platform used for centralized version management for all subprojects
                dependencies {
                    api platform(libs.dataservices.bom)
                }

                tasks.withType(JavaCompile).configureEach {
                    options.release.set(21)
                    options.encoding = 'UTF-8'
                    options.deprecation = true
                    options.compilerArgs << '-Xlint:deprecation'
                    options.compilerArgs << '-Werror'
                }

                tasks.withType(Jar).configureEach {
                    into('META-INF') {
                        from(tasks.named('cyclonedxDirectBom').get().jsonOutput) {
                            rename { 'cyclonedx.json' }
                        }
                    }
                }

                test {
                    useTestNG()
                    testLogging {
                        events = ['passed', 'skipped', 'failed']
                        exceptionFormat = 'full'
                    }
                }

                // SpotBugs configuration
                spotbugs {
                    effort = Effort.valueOf('MAX')
                    reportLevel = Confidence.valueOf('HIGH')
                }

                spotbugsMain {
                    reports {
                        xml.required = true
                        html.required = false
                    }
                }

                // Spotless configuration
                spotless {
                    java {
                        importOrder(
                            'com.mgmtp.a12.model',
                            'com.mgmtp.a12.kernel',
                            'com.mgmtp.a12.formengine',
                            'java',
                            '' // static imports
                        )
                        removeUnusedImports()
                        licenseHeaderFile rootProject.file('license_header.txt')
                        target 'src/**/*.java'
                    }
                    format('properties') {
                        licenseHeaderFile(rootProject.file('license_header.txt'), '(^[a-zA-Z])')

                        // transform C-style header in `*.properties` to `#`-comments
                        replaceRegex('Convert C-style block start to properties comment', '(?m)^\\s*/\\*', '##')
                        replaceRegex('Remove C-style block end in properties files', '(?m)^\\s*\\Q*/\\E\\s*$', '##')
                        replaceRegex('Convert C-style block asterisk lines to properties comment', '(?m)^\\s*\\* ?', '# ')

                        target('src/**/*.properties')
                    }
                }

                // Jacoco configuration
                jacoco {
                    toolVersion = '0.8.13'
                }

                jacocoTestReport {
                    dependsOn(tasks.named('test'))
                    reports {
                        xml.required = true
                        html.required = false
                    }
                }

                tasks.named('test') {
                    finalizedBy(tasks.named('jacocoTestReport'))
                }

                publishing {
                    publications {
                        mavenJava(MavenPublication) {
                            from components.java

                            final String groupIdForParent = group
                            final String versionForParent = version

                            pom.withXml {
                                asNode().appendNode('parent').with {
                                    appendNode('groupId', groupIdForParent)
                                    appendNode('artifactId', 'formengine-parent')
                                    appendNode('version', versionForParent)
                                }
                            }
                        }
                    }
                }
            } else {
                publishing {
                    publications {
                        mavenJava(MavenPublication) {
                            from components.java
                            artifactId = 'formengine-rewrite'
                        }
                    }
                }
            }
        }

        tasks.named('cyclonedxDirectBom') {
            jsonOutput.set(project.layout.buildDirectory.file('cyclonedx.json'))
            xmlOutput.unsetConvention()

            includeBuildSystem = false
            includeConfigs = ['runtimeClasspath']

            externalReferences = [
                new ExternalReference(type: ExternalReference.Type.VCS, url: 'https://git.geta12.com')
            ]
        }

        tasks.named('assemble') {
            dependsOn(tasks.named('cyclonedxDirectBom'))
        }

        // Apply common artifacts and POM configuration to all publications
        afterEvaluate {
            publishing {
                publications.all { publication ->
                    // Add CycloneDX SBOM as artifact
                    artifact(tasks.named('cyclonedxDirectBom').get().jsonOutput) {
                        classifier = 'cyclonedx'
                        extension = 'json'
                    }

                    // Add LICENSE file as artifact
                    artifact(rootProject.file('LICENSE')) {
                        classifier = 'license'
                        extension = 'txt'
                    }

                    // Add NOTICE file as artifact
                    artifact(rootProject.file('NOTICE')) {
                        classifier = 'notice'
                        extension = 'txt'
                    }

                    groupId = 'com.mgmtp.a12.formengine'

                    pom {
                        description = project.description
                        inceptionYear = '2012'

                        licenses {
                            license {
                                name = 'EUPL-1.2 OR LicenseRef-Commercial'
                                comments = 'See LICENSE artifact published alongside this module'
                            }
                        }

                        organization {
                            name = 'mgm technology partners GmbH'
                            url = 'https://www.mgm-tp.com'
                        }
                    }
                }
            }
        }

        tasks.named('deploy') {
            dependsOn tasks.named('publish')
        }
    }
}

project(':documentation') {
    pluginManager.apply('com.diffplug.spotless')

    spotless {
        format('asciidoc') {
            target '**/*.adoc'
            targetExclude('**/node_modules/**', '**/build/**')

            licenseHeaderFile(rootProject.file('license_header.txt'), '^[=\\[]')
            // transform C-style header to asciidoc block comments
            replaceRegex 'Convert C-style block start to asciidoc block comment start', '^/\\*', '////'
            replaceRegex 'Convert C-style block end to asciidoc block comment end', '^ \\*/', '////\n'
            replaceRegex 'Remove asterisk prefixes', '^ \\* ?', ''
        }
    }
}

tasks.register('nodeVerify', PnpmTask) {
    dependsOn(tasks.named('pnpmInstall'))
    pnpmCommand.set(['verify'])
}

tasks.register('nodeAssemble', PnpmTask) {
    dependsOn(tasks.named('nodeVerify'))
    dependsOn(project(':modelGraph').tasks.named('assemble'))
    pnpmCommand.set(['build'])
}

tasks.named('assemble') {
    dependsOn(tasks.named('nodeAssemble'))
}

tasks.register('assembleWithoutDocker') {
    group = 'build'
    description = 'Convenience task to run assemble without docker'

    dependsOn(tasks.named('nodeAssemble'))
    subprojects.each { subproject ->
        if (subproject.name != 'docker') {
            dependsOn(subproject.tasks.named('assemble'))
        }
    }
}

tasks.register('nodeTest', PnpmTask) {
    // The two lifecycle branches are kept strictly separate: `assemble` turns TypeScript into
    // JavaScript, `check` only runs the tests against the `lib` output that `assemble` produced (and
    // against the generated models under exampleModels/build). Nothing is compiled here, so `gradle
    // check` on its own fails on a clean checkout - use `gradle build`, or `gradle assemble check`.
    dependsOn(tasks.named('pnpmInstall'))

    // `build` depends on both `assemble` and `check` but does not order them, so this constraint is
    // what actually makes `gradle build` run the assembly first. It only applies when both branches
    // are in the task graph, which leaves `gradle check` free to fail fast on a clean checkout.
    mustRunAfter(tasks.named('nodeAssemble'))

    pnpmCommand.set(['test'])
    environment.put('NODE_ENV', 'test')
}

tasks.named('check') {
    // nodeVerify used to be reached transitively via nodeTest -> nodeAssemble
    dependsOn(tasks.named('nodeTest'), tasks.named('nodeVerify'))
}

tasks.register('nodeClean', PnpmTask) {
    dependsOn(tasks.named('pnpmInstall'))
    pnpmCommand.set(['clean'])
}

tasks.named('clean') {
    dependsOn(tasks.named('nodeClean'))
}

tasks.register('setVersion', PackageJsonModifierTask) {
    packageDirs = new YamlSlurper().parse(file('./pnpm-workspace.yaml')).packages
        .collect({ file(it) }) + file('.')
    change = Helper.createSetVersion(version)
}

versionCatalogUpdate {
    sortByKey = false
    versionSelector {
        VersionSelectors.PREFER_STABLE.select(it) && !it.candidate.version.contains('SNAPSHOT')
    }
}
